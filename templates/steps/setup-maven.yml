# Java 17, Maven 3.9.11, Maven cache and a settings.xml with Anypoint Exchange credentials.
# Maven is pinned: the hosted image's Maven 3.10 breaks mule-maven-plugin 4.9.1 and
# mule-extensions-maven-plugin 1.9.6 (NoSuchMethodError).
# The settings file is written at runtime from secret variables and never committed.
parameters:
# Change both together: the checksum is the .sha512 file published next to the archive.
- name: mavenVersion
  type: string
  default: '3.9.11'
- name: mavenSha512
  type: string
  default: 'bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978'
- name: settingsPath
  type: string
  default: $(Agent.TempDirectory)/settings.xml

steps:
- task: JavaToolInstaller@0
  displayName: Java 17
  inputs:
    versionSpec: '17'
    jdkArchitectureOption: x64
    jdkSourceOption: PreInstalled

- bash: |
    set -euo pipefail
    dir="$(Agent.ToolsDirectory)/maven/${MAVEN_VERSION}"
    if [ ! -x "$dir/bin/mvn" ]; then
      archive="$(Agent.TempDirectory)/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
      curl -fsSL --retry 3 -o "$archive" \
        "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
      echo "${MAVEN_SHA512}  ${archive}" | sha512sum -c -
      mkdir -p "$dir"
      tar -xzf "$archive" -C "$dir" --strip-components=1
    fi
    echo "##vso[task.prependpath]$dir/bin"
    "$dir/bin/mvn" -v
  displayName: Maven ${{ parameters.mavenVersion }}
  env:
    MAVEN_VERSION: ${{ parameters.mavenVersion }}
    MAVEN_SHA512: ${{ parameters.mavenSha512 }}

- task: Cache@2
  displayName: Maven cache
  inputs:
    key: 'maven | "$(Agent.OS)" | **/pom.xml'
    restoreKeys: |
      maven | "$(Agent.OS)"
    path: $(Pipeline.Workspace)/.m2/repository

- bash: |
    set -euo pipefail
    cat > "${SETTINGS_PATH}" <<XML
    <settings>
      <servers>
        <server>
          <id>anypoint-exchange-v3</id>
          <username>~~~Client~~~</username>
          <password>${ANYPOINT_CLIENT_ID}~?~${ANYPOINT_CLIENT_SECRET}</password>
        </server>
      </servers>
    </settings>
    XML
    echo "##vso[task.setvariable variable=MAVEN_SETTINGS]${SETTINGS_PATH}"
    echo "##vso[task.setvariable variable=MAVEN_ARGS]-B -s ${SETTINGS_PATH} -Dmaven.repo.local=$(Pipeline.Workspace)/.m2/repository -Danypoint.orgId=${ANYPOINT_ORG_ID}"
  displayName: Maven settings (Exchange credentials)
  env:
    SETTINGS_PATH: ${{ parameters.settingsPath }}
    ANYPOINT_ORG_ID: $(ANYPOINT_ORG_ID)
    ANYPOINT_CLIENT_ID: $(ANYPOINT_CLIENT_ID)
    ANYPOINT_CLIENT_SECRET: $(ANYPOINT_CLIENT_SECRET)
