# Entry point for Mule applications and plugins/libraries. The branch decides what runs:
#
#   pull requests, feature/*, release/*, hotfix/*  -> build
#   develop                                        -> build, publish SNAPSHOT, deploy to test (if deploy: true)
#   main                                           -> build, Maven release, deploy to uat, deploy to prod (approval) (if deploy: true)
#
# Applications consume it with `extends:` (see the README). Plugins/libraries pass `deploy: false`
# to publish to Exchange without the CloudHub 2.0 deployment stages (see ADR 7).
parameters:
- name: variableGroup
  type: string
  default: vg-00-anypoint-platform
- name: nextVersionBump
  type: string
  default: minor
- name: environments
  type: object
  default:
    test: test
    uat: uat
    prod: prod
- name: deploy
  type: boolean
  default: true

variables:
- group: ${{ parameters.variableGroup }}

stages:
- stage: ci
  displayName: Build
  jobs:
  - template: ../jobs/ci.yml

# develop ---------------------------------------------------------------
- stage: snapshot
  displayName: Publish SNAPSHOT
  dependsOn: ci
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'), ne(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - template: ../jobs/publish-snapshot.yml

- ${{ if eq(parameters.deploy, true) }}:
  - stage: deploy_test
    displayName: Deploy test
    dependsOn: snapshot
    condition: succeeded()
    variables:
      appVersion: $[ stageDependencies.snapshot.publish.outputs['publish.appVersion'] ]
    jobs:
    - template: ../jobs/deploy.yml
      parameters:
        environment: ${{ parameters.environments.test }}
        anypointEnvironment: test
        appVersion: $(appVersion)

# main ------------------------------------------------------------------
- stage: release
  displayName: Release
  dependsOn: ci
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - template: ../jobs/release.yml
    parameters:
      nextVersionBump: ${{ parameters.nextVersionBump }}

- ${{ if eq(parameters.deploy, true) }}:
  - stage: deploy_uat
    displayName: Deploy uat
    dependsOn: release
    condition: succeeded()
    variables:
      appVersion: $[ stageDependencies.release.release.outputs['release.appVersion'] ]
    jobs:
    - template: ../jobs/deploy.yml
      parameters:
        environment: ${{ parameters.environments.uat }}
        anypointEnvironment: uat
        appVersion: $(appVersion)

  - stage: deploy_prod
    displayName: Deploy prod
    dependsOn: [release, deploy_uat]
    condition: succeeded()
    variables:
      appVersion: $[ stageDependencies.release.release.outputs['release.appVersion'] ]
    jobs:
    - template: ../jobs/deploy.yml
      parameters:
        environment: ${{ parameters.environments.prod }}
        anypointEnvironment: prod
        appVersion: $(appVersion)
